<style>
  :root {
    --paper: #f1efea;
    --surface: #fbfaf7;
    --surface-raised: #ffffff;
    --ink: #211f1c;
    --ink-soft: #5b564c;
    --ink-faint: #8b8577;
    --line: #dad5c9;
    --line-strong: #c7c1b2;
    --accent: #c1442c;
    --accent-ink: #ffffff;
    --posted: #3f6b4f;
    --posted-bg: #e3ecdf;
    --pending: #a06a1a;
    --pending-bg: #f2e6cd;
    --editing: #6b6558;
    --editing-bg: #e7e3d8;
    --shadow: 0 1px 2px rgba(33,31,28,0.06), 0 8px 24px -12px rgba(33,31,28,0.18);
    --radius: 3px;
    --font-display: 'Barlow Semi Condensed', 'Arial Narrow', sans-serif;
    --font-body: 'Source Sans 3', 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', 'Consolas', monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #17160f;
      --surface: #201f18;
      --surface-raised: #262419;
      --ink: #eeeae0;
      --ink-soft: #b3ac9a;
      --ink-faint: #7d7666;
      --line: #383425;
      --line-strong: #4a4530;
      --accent: #e2794a;
      --accent-ink: #1a1712;
      --posted: #7dbb8f;
      --posted-bg: #26301f;
      --pending: #e0ab54;
      --pending-bg: #362a17;
      --editing: #a49d8a;
      --editing-bg: #2a2820;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }

  :root[data-theme="dark"] {
    --paper: #17160f;
    --surface: #201f18;
    --surface-raised: #262419;
    --ink: #eeeae0;
    --ink-soft: #b3ac9a;
    --ink-faint: #7d7666;
    --line: #383425;
    --line-strong: #4a4530;
    --accent: #e2794a;
    --accent-ink: #1a1712;
    --posted: #7dbb8f;
    --posted-bg: #26301f;
    --pending: #e0ab54;
    --pending-bg: #362a17;
    --editing: #a49d8a;
    --editing-bg: #2a2820;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { text-wrap: balance; margin: 0; }

  ::selection { background: var(--accent); color: var(--accent-ink); }

  .shell {
    display: grid;
    grid-template-columns: 300px 1fr;
    min-height: 100vh;
  }

  /* ---------- Sidebar ---------- */
  .rail {
    background: var(--surface);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .rail-head {
    padding: 22px 20px 16px;
    border-bottom: 1px solid var(--line);
  }
  .wordmark {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 0.02em;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .wordmark .bar { color: var(--accent); }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-top: 4px;
  }
  .search-wrap {
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
  }
  #search {
    width: 100%;
    font-family: var(--font-body);
    font-size: 14px;
    padding: 8px 10px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface-raised);
    color: var(--ink);
  }
  #search:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .roster {
    flex: 1;
    overflow-y: auto;
    padding: 6px 0 20px;
  }
  .letter-div {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0.1em;
    padding: 10px 20px 4px;
  }
  .client-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-left: 3px solid transparent;
    padding: 7px 17px;
    font-family: var(--font-body);
    font-size: 14.5px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .client-btn:hover { background: var(--surface-raised); color: var(--ink); }
  .client-btn.active {
    background: var(--surface-raised);
    color: var(--ink);
    border-left-color: var(--accent);
    font-weight: 600;
  }
  .client-btn .count {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
  }
  .roster:focus-visible, .client-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* ---------- Main ---------- */
  .main { padding: 28px 40px 60px; max-width: 980px; }
  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    padding-bottom: 18px;
    border-bottom: 2px solid var(--ink);
    margin-bottom: 22px;
  }
  .masthead h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 40px;
    letter-spacing: 0.01em;
  }
  .masthead .sub {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-faint);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .actions { display: flex; gap: 8px; flex-shrink: 0; }
  .btn {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--line-strong);
    background: var(--surface-raised);
    color: var(--ink);
    cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.08); color: var(--accent-ink); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 30px;
  }
  .stat {
    background: var(--surface);
    padding: 14px 18px;
  }
  .stat .num {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 26px;
    font-weight: 500;
    line-height: 1.1;
  }
  .stat.posted .num { color: var(--posted); }
  .stat.pending .num { color: var(--pending); }
  .stat .label {
    font-size: 11.5px;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 4px;
  }

  .slate {
    margin-bottom: 26px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    overflow: hidden;
    break-inside: avoid;
  }
  .slate-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 16px;
    background: repeating-linear-gradient(
      -45deg,
      var(--ink) 0px, var(--ink) 14px,
      var(--surface-raised) 14px, var(--surface-raised) 28px
    );
    position: relative;
  }
  .slate-head .month {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.03em;
    background: var(--ink);
    color: var(--paper);
    padding: 3px 12px;
    border-radius: 2px;
  }
  table.log {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  table.log th {
    text-align: left;
    font-family: var(--font-body);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 600;
    padding: 10px 16px 8px;
    border-bottom: 1px solid var(--line);
  }
  table.log td {
    padding: 9px 16px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  table.log tr:last-child td { border-bottom: none; }
  table.log tr:nth-child(even) td { background: rgba(0,0,0,0.012); }
  .col-num, .col-date { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink-soft); white-space: nowrap; }
  .col-title { color: var(--ink); }
  .chip {
    display: inline-block;
    font-family: var(--font-body);
    font-size: 11.5px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .chip.posted { background: var(--posted-bg); color: var(--posted); }
  .chip.pending { background: var(--pending-bg); color: var(--pending); }
  .chip.editing { background: var(--editing-bg); color: var(--editing); }

  .empty-state {
    color: var(--ink-faint);
    font-size: 15px;
    padding: 60px 0;
    text-align: center;
  }

  .scrollhint { overflow-x: auto; }

  #print-all-container { display: none; }

  @media print {
    .rail, .actions, .search-wrap { display: none !important; }
    .shell { display: block; }
    .main { max-width: none; padding: 0; }
    body[data-print-mode="all"] .main > .masthead,
    body[data-print-mode="all"] .main > .stats,
    body[data-print-mode="all"] .main > .slate {
      display: none !important;
    }
    #print-all-container { display: block !important; }
    .print-client { break-before: page; padding: 24px 4px; }
    .print-client:first-child { break-before: auto; }
    .slate { break-inside: avoid; }
  }
</style>

<div class="shell">

    <div class="roster" id="roster"></div>
  </nav>

  <main class="main" id="main">
    <div class="empty-state">Select a client from the roster to open their ledger.</div>
  </main>
</div>

const clientNames = Object.keys(DATA).sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:'base'}));

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function rowStatus(row) {
  const posted = row.postedOn && row.postedOn.trim() && row.postedOn.trim() !== '-';
  if (posted) return { label: 'Posted', cls: 'posted' };
  if ((row.edited || '').toUpperCase() === 'TRUE') return { label: 'Ready to post', cls: 'pending' };
  return { label: 'In edit', cls: 'editing' };
}

function clientStats(months) {
  let total = 0, posted = 0, pending = 0;
  months.forEach(m => m.rows.forEach(r => {
    total++;
    const s = rowStatus(r);
    if (s.cls === 'posted') posted++;
    else if (s.cls === 'pending') pending++;
  }));
  return { total, posted, pending, editing: total - posted - pending, months: months.length };
}

function renderSlate(month) {
  const rows = month.rows.map(r => {
    const s = rowStatus(r);
    return '<tr>' +
      '<td class="col-num">' + escapeHtml(r.number) + '</td>' +
      '<td class="col-date">' + escapeHtml(r.shotOn || '—') + '</td>' +
      '<td class="col-title">' + escapeHtml(r.videoTitle || '—') + '</td>' +
      '<td><span class="chip ' + s.cls + '">' + s.label + '</span></td>' +
      '<td class="col-date">' + escapeHtml(r.postedOn || '—') + '</td>' +
      '</tr>';
  }).join('');
  return (
    '<section class="slate">' +
      '<div class="slate-head"><span class="month">' + escapeHtml(month.title) + '</span></div>' +
      '<div class="scrollhint"><table class="log">' +
        '<thead><tr><th>#</th><th>Shot on</th><th>Video title</th><th>Status</th><th>Posted on</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table></div>' +
    '</section>'
  );
}

function clientMarkup(name, months, forPrint) {
  const stats = clientStats(months);
  const slates = months.map(renderSlate).join('');
  const actions = forPrint ? '' :
    '<div class="actions">' +
      '<button class="btn" id="print-all-btn">Print all clients</button>' +
      '<button class="btn primary" id="print-btn">Print this client</button>' +
    '</div>';
  return (
    '<header class="masthead">' +
      '<div><h1>' + escapeHtml(name) + '</h1><div class="sub">Video production ledger</div></div>' +
      actions +
    '</header>' +
    '<div class="stats">' +
      '<div class="stat"><div class="num">' + stats.total + '</div><div class="label">Total videos</div></div>' +
      '<div class="stat posted"><div class="num">' + stats.posted + '</div><div class="label">Posted</div></div>' +
      '<div class="stat pending"><div class="num">' + stats.pending + '</div><div class="label">Ready to post</div></div>' +
      '<div class="stat"><div class="num">' + stats.months + '</div><div class="label">Months tracked</div></div>' +
    '</div>' +
    slates
  );
}

let activeClient = null;

function selectClient(name) {
  activeClient = name;
  document.getElementById('main').innerHTML = clientMarkup(name, DATA[name], false);
  document.querySelectorAll('.client-btn').forEach(b => b.classList.toggle('active', b.dataset.name === name));
  document.getElementById('print-btn').addEventListener('click', () => {
    document.body.setAttribute('data-print-mode', 'single');
    window.print();
  });
  document.getElementById('print-all-btn').addEventListener('click', printAllClients);
  document.getElementById('main').scrollTop = 0;
}

function printAllClients() {
  const container = document.getElementById('print-all-container');
  container.innerHTML = clientNames.map(name =>
    '<div class="print-client">' + clientMarkup(name, DATA[name], true) + '</div>'
  ).join('');
  document.body.setAttribute('data-print-mode', 'all');
  window.print();
}

window.addEventListener('afterprint', () => {
  document.body.removeAttribute('data-print-mode');
  document.getElementById('print-all-container').innerHTML = '';
});

function renderRoster(filter) {
  const q = (filter || '').trim().toLowerCase();
  const roster = document.getElementById('roster');
  let lastLetter = '';
  let html = '';
  clientNames.forEach(name => {
    if (q && !name.toLowerCase().includes(q)) return;
    const letter = name[0].toUpperCase();
    if (!q && letter !== lastLetter) {
      html += '<div class="letter-div">' + letter + '</div>';
      lastLetter = letter;
    }
    const count = DATA[name].reduce((n, m) => n + m.rows.length, 0);
    html += '<button class="client-btn' + (name === activeClient ? ' active' : '') + '" data-name="' + escapeHtml(name) + '">' +
      '<span>' + escapeHtml(name) + '</span><span class="count">' + count + '</span></button>';
  });
  roster.innerHTML = html || '<div class="letter-div">No matches</div>';
  roster.querySelectorAll('.client-btn').forEach(btn => {
    btn.addEventListener('click', () => selectClient(btn.dataset.name));
  });
}

document.getElementById('search').addEventListener('input', e => renderRoster(e.target.value));
renderRoster('');
if (clientNames.length) selectClient(clientNames[0]);
</script>
