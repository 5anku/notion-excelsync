<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patrol Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #f1efea;
    --surface: #fbfaf7;
    --surface-raised: #ffffff;
    --ink: #211f1c;
    --ink-soft: #5b564c;
    --ink-faint: #8b8577;
    --line: #dad5c9;
    --line-strong: #c7c1b2;
    --accent: #c1442c;
    --accent-ink: #ffffff;
    --posted: #3f6b4f;
    --posted-bg: #e3ecdf;
    --pending: #a06a1a;
    --pending-bg: #f2e6cd;
    --editing: #6b6558;
    --editing-bg: #e7e3d8;
    --danger: #a3352a;
    --danger-bg: #f5e1de;
    --radius: 3px;
    --font-display: 'Barlow Semi Condensed', 'Arial Narrow', sans-serif;
    --font-body: 'Source Sans 3', 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', 'Consolas', monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #17160f; --surface: #201f18; --surface-raised: #262419;
      --ink: #eeeae0; --ink-soft: #b3ac9a; --ink-faint: #7d7666;
      --line: #383425; --line-strong: #4a4530;
      --accent: #e2794a;
      --posted: #7dbb8f; --posted-bg: #26301f;
      --pending: #e0ab54; --pending-bg: #362a17;
      --editing: #a49d8a; --editing-bg: #2a2820;
      --danger: #e08a7d; --danger-bg: #3a241f;
    }
  }
  :root[data-theme="dark"] {
    --paper: #17160f; --surface: #201f18; --surface-raised: #262419;
    --ink: #eeeae0; --ink-soft: #b3ac9a; --ink-faint: #7d7666;
    --line: #383425; --line-strong: #4a4530;
    --accent: #e2794a;
    --posted: #7dbb8f; --posted-bg: #26301f;
    --pending: #e0ab54; --pending-bg: #362a17;
    --editing: #a49d8a; --editing-bg: #2a2820;
    --danger: #e08a7d; --danger-bg: #3a241f;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  ::selection { background: var(--accent); color: var(--accent-ink); }

  .shell { display: grid; grid-template-columns: 300px 1fr; min-height: 100vh; }

  .rail { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 100vh; }
  .rail-head { padding: 22px 20px 16px; border-bottom: 1px solid var(--line); }
  .wordmark { font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: 0.02em; display: flex; align-items: baseline; gap: 8px; }
  .wordmark .bar { color: var(--accent); }
  .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint); margin-top: 4px; }
  .search-wrap { padding: 14px 20px; border-bottom: 1px solid var(--line); }
  #search { width: 100%; font-family: var(--font-body); font-size: 14px; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface-raised); color: var(--ink); }
  #search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .roster { flex: 1; overflow-y: auto; padding: 6px 0 20px; }
  .letter-div { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); letter-spacing: 0.1em; padding: 10px 20px 4px; }
  .client-btn { display: flex; align-items: center; justify-content: space-between; width: 100%; text-align: left; background: none; border: none; border-left: 3px solid transparent; padding: 7px 17px; font-family: var(--font-body); font-size: 14.5px; color: var(--ink-soft); cursor: pointer; }
  .client-btn:hover { background: var(--surface-raised); color: var(--ink); }
  .client-btn.active { background: var(--surface-raised); color: var(--ink); border-left-color: var(--accent); font-weight: 600; }
  .client-btn .count { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); }
  .client-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .edit-toggle { margin: 14px 20px 18px; }
  .edit-toggle label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); cursor: pointer; }

  .main { padding: 28px 40px 60px; max-width: 1000px; }
  .masthead { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; padding-bottom: 18px; border-bottom: 2px solid var(--ink); margin-bottom: 18px; }
  .masthead h1 { font-family: var(--font-display); font-weight: 800; font-size: 40px; letter-spacing: 0.01em; }
  .masthead .sub { font-family: var(--font-mono); font-size: 12px; color: var(--ink-faint); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 4px; }
  .actions { display: flex; gap: 8px; flex-shrink: 0; }
  .btn { font-family: var(--font-body); font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: var(--surface-raised); color: var(--ink); cursor: pointer; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.08); color: var(--accent-ink); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn:disabled { opacity: 0.5; cursor: default; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin-bottom: 30px; }
  .stat { background: var(--surface); padding: 14px 18px; }
  .stat .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 26px; font-weight: 500; line-height: 1.1; }
  .stat.posted .num { color: var(--posted); }
  .stat.pending .num { color: var(--pending); }
  .stat .label { font-size: 11.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; }
  .no-quota-note { font-size: 12.5px; color: var(--pending); margin: -18px 0 24px; }

  .slate { margin-bottom: 26px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; break-inside: avoid; }
  .slate-head { display: flex; align-items: center; gap: 10px; padding: 9px 16px; background: repeating-linear-gradient(-45deg, var(--ink) 0px, var(--ink) 14px, var(--surface-raised) 14px, var(--surface-raised) 28px); }
  .slate-head .month { font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: 0.03em; background: var(--ink); color: var(--paper); padding: 3px 12px; border-radius: 2px; }
  .slate-head .month.editable { cursor: pointer; }
  .slate-head .month.editable:hover { filter: brightness(1.2); }
  .slate-head .fill { font-family: var(--font-mono); font-size: 11px; color: var(--paper); background: rgba(255,255,255,0.15); padding: 2px 8px; border-radius: 10px; }
  .label-editor { display: flex; align-items: center; gap: 6px; }
  .label-editor input { font-family: var(--font-display); font-weight: 700; font-size: 15px; padding: 2px 8px; border-radius: 2px; border: 1px solid var(--line-strong); }
  .label-editor .mini-btn { font-size: 11px; padding: 3px 8px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: var(--surface-raised); color: var(--ink); cursor: pointer; }

  table.log { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.log th { text-align: left; font-family: var(--font-body); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); font-weight: 600; padding: 10px 16px 8px; border-bottom: 1px solid var(--line); }
  table.log td { padding: 9px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.log tr:last-child td { border-bottom: none; }
  table.log tr:nth-child(even) td { background: rgba(0,0,0,0.012); }
  table.log tr.pending-row td { color: var(--ink-faint); font-style: italic; }
  .col-num, .col-date { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink-soft); white-space: nowrap; }
  .col-title { color: var(--ink); }
  .chip { display: inline-block; font-family: var(--font-body); font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 20px; white-space: nowrap; cursor: default; }
  .chip.posted { background: var(--posted-bg); color: var(--posted); }
  .chip.pending { background: var(--pending-bg); color: var(--pending); }
  .chip.editing { background: var(--editing-bg); color: var(--editing); }
  .chip.clickable { cursor: pointer; border: 1px dashed transparent; }
  .chip.clickable:hover { border-color: currentColor; }

  .edit-cell { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .edit-cell select, .edit-cell input[type="date"] {
    font-family: var(--font-body); font-size: 12.5px; padding: 4px 6px;
    border: 1px solid var(--line-strong); border-radius: var(--radius);
    background: var(--surface-raised); color: var(--ink);
  }
  .edit-cell .mini-btn { font-size: 11px; padding: 4px 8px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: var(--surface-raised); color: var(--ink); cursor: pointer; }
  .edit-cell .mini-btn.save { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .edit-cell .mini-btn:disabled { opacity: 0.5; }
  .row-error { color: var(--danger); font-size: 11px; margin-top: 3px; }

  .empty-state { color: var(--ink-faint); font-size: 15px; padding: 60px 0; text-align: center; }
  .load-state { color: var(--ink-faint); font-size: 15px; padding: 60px 0; text-align: center; }
  .scrollhint { overflow-x: auto; }
  #print-all-container { display: none; }

  @media print {
    .rail, .actions, .search-wrap, .edit-toggle, .edit-cell { display: none !important; }
    .shell { display: block; }
    .main { max-width: none; padding: 0; }
    body[data-print-mode="all"] .main > .masthead,
    body[data-print-mode="all"] .main > .stats,
    body[data-print-mode="all"] .main > .slate {
      display: none !important;
    }
    #print-all-container { display: block !important; }
    .print-client { break-before: page; padding: 24px 4px; }
    .print-client:first-child { break-before: auto; }
    .slate { break-inside: avoid; }
    .chip-static { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 20px; }
  }
</style>

<div class="shell">
  <nav class="rail" aria-label="Client roster">
    <div class="rail-head">
      <div class="wordmark">PATROL <span class="bar">/</span> LEDGER</div>
      <div class="eyebrow" id="eyebrow">Production tracker</div>
    </div>
    <div class="search-wrap">
      <input id="search" type="text" placeholder="Find a client&hellip;" autocomplete="off">
    </div>
    <div class="roster" id="roster"><div class="letter-div">Loading&hellip;</div></div>
    <div class="edit-toggle">
      <label><input type="checkbox" id="editModeToggle"> Edit mode</label>
    </div>
  </nav>

  <main class="main" id="main">
    <div class="load-state">Loading live data from Notion&hellip;</div>
  </main>
</div>

<div id="print-all-container"></div>

<script>
let VIDEOS = [];
let CLIENTS = [];
let STATUS_OPTIONS = [];
let PERIOD_LABELS = {}; // "Client|PeriodIndex" -> label
let quotaByLower = new Map();
let DATA = {}; // clientName -> videos[]
let clientNames = [];
let activeClient = null;
let editMode = false;

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function monthLabel(isoDate) {
  if (!isoDate) return 'Unscheduled';
  const d = new Date(isoDate + 'T00:00:00');
  if (isNaN(d)) return 'Unscheduled';
  return d.toLocaleString('en-US', { month: 'long', year: 'numeric' });
}

function shortDate(isoDate) {
  if (!isoDate) return '—';
  const d = new Date(isoDate + 'T00:00:00');
  if (isNaN(d)) return isoDate;
  return `${d.getDate()}/${d.getMonth() + 1}`;
}

function rowStatus(v) {
  if (v.postedDate) return { label: 'Posted', cls: 'posted' };
  if (v.status === 'Done') return { label: 'Ready to post', cls: 'pending' };
  return { label: v.status || 'In progress', cls: 'editing' };
}

async function loadData() {
  try {
    const resp = await fetch('/api/ledger');
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Failed to load');
    VIDEOS = data.videos || [];
    CLIENTS = data.clients || [];
    STATUS_OPTIONS = data.statusOptions || [];
    PERIOD_LABELS = data.periodLabels || {};
    quotaByLower = new Map(CLIENTS.filter(c => c.quota != null).map(c => [c.name.toLowerCase(), c.quota]));

    DATA = {};
    VIDEOS.forEach(v => {
      const key = v.clientName || 'Unassigned';
      (DATA[key] = DATA[key] || []).push(v);
    });
    clientNames = Object.keys(DATA).sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));

    document.getElementById('eyebrow').textContent = `Production tracker · ${clientNames.length} accounts · ${VIDEOS.length} videos`;
    renderRoster('');
    if (clientNames.length) selectClient(clientNames[0]);
    else document.getElementById('main').innerHTML = '<div class="empty-state">No videos found.</div>';
  } catch (e) {
    document.getElementById('main').innerHTML = '<div class="empty-state">Failed to load: ' + escapeHtml(e.message) + '</div>';
  }
}

/**
 * Chunks a client's videos into contract-month tables of exactly `quota`
 * size, in shoot-date order — not by calendar month. Overflow from a full
 * period spills into the next one, and a short period stays short (pending
 * slots render blank) until later shoots fill it.
 */
function buildPeriods(videos, quota) {
  const sorted = videos.slice().sort((a, b) => {
    if (!a.shootDate && !b.shootDate) return 0;
    if (!a.shootDate) return 1;
    if (!b.shootDate) return -1;
    return a.shootDate.localeCompare(b.shootDate);
  });

  if (!quota || quota <= 0) {
    // No quota on file — fall back to plain calendar-month grouping.
    const byMonth = new Map();
    sorted.slice().reverse().forEach(v => {
      const key = monthLabel(v.shootDate);
      (byMonth.get(key) || byMonth.set(key, []).get(key)).push(v);
    });
    return Array.from(byMonth.entries()).map(([label, vids]) => ({ label, videos: vids, quota: vids.length, noQuota: true }));
  }

  const periods = [];
  for (let i = 0; i < sorted.length; i += quota) {
    periods.push(sorted.slice(i, i + quota));
  }
  if (periods.length === 0) periods.push([]);

  return periods.map((vids, idx) => {
    const periodIndex = idx + 1;
    const defaultLabel = vids.length ? monthLabel(vids[0].shootDate) : 'Contract Month ' + periodIndex;
    return { periodIndex, videos: vids, quota, defaultLabel };
  });
}

function clientStats(videos) {
  let posted = 0, pending = 0;
  videos.forEach(v => {
    const s = rowStatus(v);
    if (s.cls === 'posted') posted++;
    else if (s.cls === 'pending') pending++;
  });
  return { total: videos.length, posted, pending };
}

function statusOptionsHtml(selected) {
  return STATUS_OPTIONS.map(o => '<option value="' + escapeHtml(o) + '"' + (o === selected ? ' selected' : '') + '>' + escapeHtml(o) + '</option>').join('');
}

function rowMarkup(v, num, forPrint) {
  if (!v) {
    return '<tr class="pending-row"><td class="col-num">' + num + '</td><td class="col-title">—</td><td>—</td><td class="col-date">—</td></tr>';
  }
  const s = rowStatus(v);
  const chipHtml = forPrint
    ? '<span class="chip-static ' + s.cls + '">' + escapeHtml(s.label) + '</span>'
    : '<span class="chip ' + s.cls + (editMode ? ' clickable' : '') + '" data-page-id="' + escapeHtml(v.pageId) + '"' + (editMode ? ' onclick="openEditor(this)"' : '') + '>' + escapeHtml(s.label) + '</span>';
  return (
    '<tr>' +
      '<td class="col-num">' + num + '</td>' +
      '<td class="col-title">' + escapeHtml(v.title || '—') + '</td>' +
      '<td class="col-status" data-page-id="' + escapeHtml(v.pageId) + '">' + chipHtml + '</td>' +
      '<td class="col-date">' + shortDate(v.postedDate) + '</td>' +
    '</tr>'
  );
}

function openEditor(chipEl) {
  const pageId = chipEl.dataset.pageId;
  const v = VIDEOS.find(x => x.pageId === pageId);
  if (!v) return;
  const cell = chipEl.closest('td');
  cell.innerHTML =
    '<div class="edit-cell">' +
      '<select class="status-input">' + statusOptionsHtml(v.status) + '</select>' +
      '<input type="date" class="date-input" value="' + (v.postedDate || '') + '">' +
      '<button class="mini-btn save" onclick="saveEdit(this, \'' + pageId + '\')">Save</button>' +
      '<button class="mini-btn" onclick="renderClientRows()">Cancel</button>' +
    '</div>';
}

function getLedgerPassword() {
  let pw = sessionStorage.getItem('ledgerPw');
  if (!pw) {
    pw = prompt('Enter the ledger edit password:');
    if (pw) sessionStorage.setItem('ledgerPw', pw);
  }
  return pw;
}

async function saveEdit(btn, pageId) {
  const cell = btn.closest('td');
  const status = cell.querySelector('.status-input').value;
  const postedDate = cell.querySelector('.date-input').value || null;
  const pw = getLedgerPassword();
  if (!pw) return;

  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    const resp = await fetch('/api/update-video', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-ledger-password': pw },
      body: JSON.stringify({ pageId, status, postedDate }),
    });
    const data = await resp.json();
    if (!resp.ok) {
      if (resp.status === 401) sessionStorage.removeItem('ledgerPw');
      throw new Error(data.error || 'Save failed');
    }
    const v = VIDEOS.find(x => x.pageId === pageId);
    if (v) { v.status = status; v.postedDate = postedDate; }
    renderClientRows();
  } catch (e) {
    const err = document.createElement('div');
    err.className = 'row-error';
    err.textContent = e.message;
    cell.appendChild(err);
    btn.disabled = false;
    btn.textContent = 'Save';
  }
}

function openLabelEditor(el, clientName, periodIndex, currentLabel) {
  const wrap = el.closest('.slate-head');
  wrap.innerHTML =
    '<div class="label-editor">' +
      '<input type="text" class="label-input" value="' + escapeHtml(currentLabel) + '">' +
      '<button class="mini-btn save" onclick="saveLabel(this, \'' + escapeHtml(clientName).replace(/'/g, "\\'") + '\', ' + periodIndex + ')">Save</button>' +
      '<button class="mini-btn" onclick="renderClientRows()">Cancel</button>' +
    '</div>';
}

async function saveLabel(btn, clientName, periodIndex) {
  const input = btn.closest('.label-editor').querySelector('.label-input');
  const label = input.value.trim();
  const pw = getLedgerPassword();
  if (!pw) return;

  btn.disabled = true;
  try {
    const resp = await fetch('/api/update-period-label', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-ledger-password': pw },
      body: JSON.stringify({ clientName, periodIndex, label }),
    });
    const data = await resp.json();
    if (!resp.ok) {
      if (resp.status === 401) sessionStorage.removeItem('ledgerPw');
      throw new Error(data.error || 'Save failed');
    }
    PERIOD_LABELS[clientName + '|' + periodIndex] = label;
    renderClientRows();
  } catch (e) {
    alert(e.message);
    btn.disabled = false;
  }
}

function renderClientRows() {
  if (activeClient) selectClient(activeClient);
}

function periodMarkup(clientName, period, forPrint) {
  const key = clientName + '|' + period.periodIndex;
  const label = (PERIOD_LABELS[key] != null && PERIOD_LABELS[key] !== '') ? PERIOD_LABELS[key] : period.defaultLabel;
  const filled = period.videos.filter(Boolean).length;
  const rows = [];
  for (let i = 0; i < period.quota; i++) {
    rows.push(rowMarkup(period.videos[i], i + 1, forPrint));
  }
  const monthClass = forPrint || period.noQuota ? 'month' : 'month editable';
  const monthAttr = forPrint || period.noQuota
    ? ''
    : ' onclick="openLabelEditor(this, \'' + escapeHtml(clientName).replace(/'/g, "\\'") + '\', ' + period.periodIndex + ', \'' + escapeHtml(label).replace(/'/g, "\\'") + '\')"';
  return (
    '<section class="slate">' +
      '<div class="slate-head"><span class="' + monthClass + '"' + monthAttr + '>' + escapeHtml(label) + '</span>' +
        (period.noQuota ? '' : '<span class="fill">' + filled + ' / ' + period.quota + '</span>') +
      '</div>' +
      '<div class="scrollhint"><table class="log">' +
        '<thead><tr><th>#</th><th>Content name</th><th>Status</th><th>Posted on</th></tr></thead>' +
        '<tbody>' + rows.join('') + '</tbody>' +
      '</table></div>' +
    '</section>'
  );
}

function clientMarkup(name, videos, forPrint) {
  const quota = quotaByLower.get(name.toLowerCase());
  const periods = buildPeriods(videos, quota).slice().reverse(); // newest first
  const stats = clientStats(videos);

  const slates = periods.map(p => periodMarkup(name, p, forPrint)).join('');

  const actions = forPrint ? '' :
    '<div class="actions">' +
      '<button class="btn" id="print-all-btn">Print all clients</button>' +
      '<button class="btn primary" id="print-btn">Print this client</button>' +
    '</div>';

  const noQuotaNote = (!forPrint && !quota) ? '<div class="no-quota-note">No quota on file for this client in Notion — showing calendar-month grouping instead of contract months.</div>' : '';

  return (
    '<header class="masthead"><div><h1>' + escapeHtml(name) + '</h1><div class="sub">Video production ledger' + (quota ? ' · Quota ' + quota + '/month' : '') + '</div></div>' + actions + '</header>' +
    noQuotaNote +
    '<div class="stats">' +
      '<div class="stat"><div class="num">' + stats.total + '</div><div class="label">Total videos</div></div>' +
      '<div class="stat posted"><div class="num">' + stats.posted + '</div><div class="label">Posted</div></div>' +
      '<div class="stat pending"><div class="num">' + stats.pending + '</div><div class="label">Ready to post</div></div>' +
      '<div class="stat"><div class="num">' + periods.length + '</div><div class="label">Contract months</div></div>' +
    '</div>' +
    slates
  );
}

function selectClient(name) {
  activeClient = name;
  document.getElementById('main').innerHTML = clientMarkup(name, DATA[name] || [], false);
  document.querySelectorAll('.client-btn').forEach(b => b.classList.toggle('active', b.dataset.name === name));
  const printBtn = document.getElementById('print-btn');
  const printAllBtn = document.getElementById('print-all-btn');
  if (printBtn) printBtn.addEventListener('click', () => { document.body.setAttribute('data-print-mode', 'single'); window.print(); });
  if (printAllBtn) printAllBtn.addEventListener('click', printAllClients);
  document.getElementById('main').scrollTop = 0;
}

function printAllClients() {
  const container = document.getElementById('print-all-container');
  container.innerHTML = clientNames.map(name => '<div class="print-client">' + clientMarkup(name, DATA[name], true) + '</div>').join('');
  document.body.setAttribute('data-print-mode', 'all');
  window.print();
}
window.addEventListener('afterprint', () => {
  document.body.removeAttribute('data-print-mode');
  document.getElementById('print-all-container').innerHTML = '';
});

function renderRoster(filter) {
  const q = (filter || '').trim().toLowerCase();
  const roster = document.getElementById('roster');
  let lastLetter = '';
  let html = '';
  clientNames.forEach(name => {
    if (q && !name.toLowerCase().includes(q)) return;
    const letter = name[0].toUpperCase();
    if (!q && letter !== lastLetter) { html += '<div class="letter-div">' + letter + '</div>'; lastLetter = letter; }
    html += '<button class="client-btn' + (name === activeClient ? ' active' : '') + '" data-name="' + escapeHtml(name) + '">' +
      '<span>' + escapeHtml(name) + '</span><span class="count">' + DATA[name].length + '</span></button>';
  });
  roster.innerHTML = html || '<div class="letter-div">No matches</div>';
  roster.querySelectorAll('.client-btn').forEach(btn => btn.addEventListener('click', () => selectClient(btn.dataset.name)));
}

document.getElementById('search').addEventListener('input', e => renderRoster(e.target.value));
document.getElementById('editModeToggle').addEventListener('change', e => { editMode = e.target.checked; renderClientRows(); });

loadData();
</script>
